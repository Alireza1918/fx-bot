name: cmd
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: cmd
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: chk
        run: python check_cmd.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - if: steps.chk.outputs.go == 'true'
        run: |
          pip install yfinance mplfinance six arabic-reshaper python-bidi
          mkdir -p fonts
          curl -L -o fonts/Vazirmatn.ttf "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf"
      - if: steps.chk.outputs.go == 'true'
        run: python generate.py
      - if: steps.chk.outputs.go == 'true'
        run: python send.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT }} \
            -d text="❌ این بار چارت مناسب پیدا نشد. دوباره بنویس: تعویض"
